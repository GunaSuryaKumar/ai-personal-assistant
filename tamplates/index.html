<!DOCTYPE html>
<html>
<head>
    <title>AI Personal Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-4">AI Personal Assistant</h1>
        <div class="mb-4">
            <input type="text" id="commandInput" class="w-full p-2 border rounded" placeholder="Enter your command...">
            <button onclick="sendCommand()" class="mt-2 bg-blue-500 text-white p-2 rounded">Send Command</button>
            <button onclick="startVoice()" class="mt-2 bg-green-500 text-white p-2 rounded ml-2">Voice Input</button>
        </div>
        <div id="response" class="bg-white p-4 rounded shadow"></div>
        <div id="notes" class="mt-4">
            <h2 class="text-xl font-bold mb-2">Notes</h2>
            <button onclick="fetchNotes()" class="mb-2 bg-purple-500 text-white p-2 rounded">View Notes</button>
            <div id="notesList"></div>
        </div>
    </div>
    <script>
        async function sendCommand() {
            const input = document.getElementById('commandInput').value;
            const response = await fetch('/command', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({command: input})
            });
            const data = await response.json();
            displayResponse(data);
        }

        async function startVoice() {
            alert('Voice input is not available in the browser-based deployment.');
        }

        async function fetchNotes() {
            const response = await fetch('/command', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({command: 'get_notes'})
            });
            const data = await response.json();
            displayNotes(data.result);
        }

        function displayResponse(data) {
            const responseDiv = document.getElementById('response');
            responseDiv.innerHTML = `<p><strong>${data.type.toUpperCase()}:</strong> ${data.result}</p>`;
        }

        function displayNotes(notes) {
            const notesList = document.getElementById('notesList');
            notesList.innerHTML = notes.map(note => `
                <div class="bg-gray-200 p-2 mb-2 rounded">
                    <p>${note.content}</p>
                    <small>${note.created_at}</small>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
